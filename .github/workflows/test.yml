name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-test.txt
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt -r requirements-test.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run regression tests
        run: python -m pytest -q --junitxml=logs/tests.xml
      - name: Render GUI and decode media
        run: python app.py --smoke-test-report logs/source-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: logs/
  speakers:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-speakers-lock.txt
            requirements-test.txt
      - run: choco install ffmpeg --no-progress -y
      - run: python -m pip install -r requirements-speakers-lock.txt -r requirements-test.txt
      - run: python scripts/setup_speaker_acceleration.py --backend directml
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=logs/speaker-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speaker-checks-windows
          path: logs/
